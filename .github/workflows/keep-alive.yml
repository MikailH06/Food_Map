# Keep-alive ping.
#
# This is not optional garnish — without it the site goes down silently in two
# separate ways:
#
#   * Render's free web service sleeps after 15 minutes with no traffic. The
#     next visitor waits ~50 seconds for a cold start.
#
#   * Supabase PAUSES a free project after 7 days with no database activity.
#     A paused project must be restored by hand from the dashboard; until then
#     every request fails.
#
# /health runs a real database query, so one ping resets both timers at once.
#
# SETUP: add a repository variable named HEALTH_URL pointing at your deployed
# service, e.g. https://food-map.onrender.com/health
#   Settings -> Secrets and variables -> Actions -> Variables -> New variable
#
# Until that variable exists the job skips rather than failing every run.

name: Keep alive

on:
  schedule:
    # Every 10 minutes. Render sleeps at 15, so this leaves headroom for a
    # missed run — GitHub's scheduler is best-effort and can be late under load.
    - cron: '*/10 * * * *'
  workflow_dispatch: # lets you trigger it by hand to test

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "HEALTH_URL is not set — skipping."
            echo "Add it under Settings > Secrets and variables > Actions > Variables."
            exit 0
          fi

          echo "Pinging $HEALTH_URL"

          # A sleeping Render instance can take ~50s to wake, so allow well
          # beyond that and retry rather than reporting a false failure.
          for attempt in 1 2 3; do
            status=$(curl --silent --show-error --location \
                          --max-time 90 --write-out '%{http_code}' \
                          --output /tmp/health.json \
                          "$HEALTH_URL" || echo "000")

            if [ "$status" = "200" ]; then
              echo "OK ($status)"
              cat /tmp/health.json
              exit 0
            fi

            echo "Attempt $attempt returned $status"
            [ "$attempt" -lt 3 ] && sleep 30
          done

          echo "Health check failed after 3 attempts."
          cat /tmp/health.json 2>/dev/null || true
          exit 1
